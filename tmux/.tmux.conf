# Prefix: Ctrl+s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Basic behavior
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Splits keep current directory
unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window keeps current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Sessionizer
bind f display-popup -E -w 80% -h 80% "$HOME/.local/bin/tmux-sessionizer"

# Lazygit popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# TPM plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux#v2.3.0"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

# Catppuccin configuration
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load Catppuccin explicitly
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status bar
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"

# Resurrect / Continuum
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"

# TPM must remain at the bottom
run "~/.tmux/plugins/tpm/tpm"
